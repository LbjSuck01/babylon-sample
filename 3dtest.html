<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babylon.js 滑板物理模拟 (修复版)</title>
    <!-- 引入 Babylon.js 核心库 -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- 引入 Cannon.js 物理引擎 (Babylon.js v5+ 通常推荐 Havok 或 Ammo，但 Cannon 仍可用 via plugin) -->
    <!-- 注意：Babylon.js 6.x+ 默认不再内置 Cannon，需要引入 cannon-es 或者使用 Havok。 -->
    <!-- 为了兼容性和简单性，这里我们使用 Babylon.js 推荐的 Havok 物理引擎，它更稳定且 API 现代 -->
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            z-index: 10;
        }
        .card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            max-width: 300px;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.5rem; color: #4facfe; }
        p { margin: 5px 0; font-size: 0.9rem; line-height: 1.4; color: #ddd; }
        .controls { margin-top: 15px; pointer-events: auto; }
        button {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            padding: 10px 20px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="card">
            <h1>滑板物理模拟 (Havok)</h1>
            <p>• 修复了 Joint API 报错</p>
            <p>• 使用 Havok 物理引擎 (更稳定)</p>
            <p>• 轮子通过 HingeJoint 连接，可真实滚动</p>
            <div class="controls">
                <button id="resetBtn">重置滑板位置</button>
            </div>
        </div>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const resetBtn = document.getElementById("resetBtn");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);

            // 1. 初始化 Havok 物理引擎 (推荐替代 Cannon，API 更现代且稳定)
            // Havok 是 Babylon.js 目前首选的物理插件
            const havokInstance = await HavokPhysics();
            const physicsPlugin = new BABYLON.HavokPlugin(true, havokInstance);
            
            // 启用物理，设置重力
            scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), physicsPlugin);

            // 2. 相机与灯光
            const camera = new BABYLON.ArcRotateCamera("camera", new BABYLON.Vector3(-15, 10, -15), new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 5;
            camera.upperRadiusLimit = 50;

            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.7;
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(20, 40, 20);
            dirLight.intensity = 0.8;

            // 阴影生成器
            const shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;

            // 3. 材质
            const boardMat = new BABYLON.StandardMaterial("boardMat", scene);
            boardMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.9);
            
            const wheelMat = new BABYLON.StandardMaterial("wheelMat", scene);
            wheelMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.8, 0.8, 0.8);

            // 4. 环境 (地面与斜坡)
            // 地面
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 50, height: 50}, scene);
            ground.position.y = -2;
            ground.material = groundMat;
            ground.receiveShadows = true;
            // Havok 中，mass: 0 表示静态物体
            ground.physicsImpostor = new BABYLON.PhysicsImpostor(ground, BABYLON.PhysicsImpostor.BoxImpostor, { mass: 0, restitution: 0.1, friction: 0.5 }, scene);

            // 斜坡
            const ramp = BABYLON.MeshBuilder.CreateBox("ramp", {width: 10, height: 1, depth: 30}, scene);
            ramp.position = new BABYLON.Vector3(0, 2, 10);
            ramp.rotation.x = -Math.PI / 8; 
            ramp.material = groundMat;
            ramp.receiveShadows = true;
            ramp.physicsImpostor = new BABYLON.PhysicsImpostor(ramp, BABYLON.PhysicsImpostor.BoxImpostor, { mass: 0, restitution: 0.1, friction: 0.3 }, scene);

            // 5. 创建滑板模型
            const skateboardRoot = new BABYLON.TransformNode("skateboardRoot", scene);

            // 板身参数
            const deckWidth = 2;
            const deckHeight = 0.2;
            const deckLength = 6;
            
            const deck = BABYLON.MeshBuilder.CreateBox("deck", {width: deckWidth, height: deckHeight, depth: deckLength}, scene);
            deck.position.y = 0.5; 
            deck.material = boardMat;
            deck.parent = skateboardRoot;
            shadowGenerator.addShadowCaster(deck);

            // 轮子参数
            const wheelRadius = 0.4;
            const wheelThickness = 0.3;
            const wheelOffsetZ = 2.2; 
            const wheelOffsetX = 0.8; 
            const wheelY = 0; 

            // 创建4个轮子
            const positions = [
                { x: -wheelOffsetX, z: -wheelOffsetZ, name: "wheel_LB" }, // 左后
                { x: wheelOffsetX, z: -wheelOffsetZ, name: "wheel_RB" },  // 右后
                { x: -wheelOffsetX, z: wheelOffsetZ, name: "wheel_LF" },  // 左前
                { x: wheelOffsetX, z: wheelOffsetZ, name: "wheel_RF" }    // 右前
            ];

            const wheels = [];
            
            // 先创建板身的物理 impostor
            // 注意：在 Havok/Cannon 中，父级和子级如果都有物理，通常需要 Joint 连接
            deck.physicsImpostor = new BABYLON.PhysicsImpostor(deck, BABYLON.PhysicsImpostor.BoxImpostor, { 
                mass: 10, 
                restitution: 0.1, 
                friction: 0.5 
            }, scene);

            positions.forEach((pos) => {
                // 创建轮子 Mesh
                const wheel = BABYLON.MeshBuilder.CreateCylinder(pos.name, {
                    diameter: wheelRadius * 2, 
                    height: wheelThickness, 
                    tessellation: 24
                }, scene);
                
                // 旋转 Mesh 使圆柱体轴线沿 X 轴 (默认是 Y 轴)
                wheel.rotation.z = Math.PI / 2; 
                
                wheel.position = new BABYLON.Vector3(pos.x, wheelY, pos.z);
                wheel.material = wheelMat;
                wheel.parent = skateboardRoot;
                shadowGenerator.addShadowCaster(wheel);

                // 创建轮子的物理 Impostor
                // CylinderImpostor 在 Havok 中可能需要特定方向，通常 Cylinder 轴是 Y。
                // 因为我们旋转了 Mesh，我们需要确保物理形状也对应旋转，或者使用 Box 近似，或者调整 Joint。
                // 在 Havok 中，CylinderImpostor 的轴通常是局部 Y 轴。
                // 由于我们将 Mesh 旋转了 Z 轴 90度，局部 Y 轴现在指向世界 X 轴方向。这正是我们想要的轮子滚动轴。
                
                wheel.physicsImpostor = new BABYLON.PhysicsImpostor(wheel, BABYLON.PhysicsImpostor.CylinderImpostor, { 
                    mass: 2, 
                    restitution: 0.1, 
                    friction: 0.8 // 高摩擦力以帮助滚动
                }, scene);

                wheels.push(wheel);

                // &zwnj;*** 关键修复：使用 addJoint 而不是 new LockJoint ***&zwnj;
                // 使用 HingeJoint (铰链关节) 允许轮子绕轴旋转
                // axis: 旋转轴。对于我们的轮子，局部 Y 轴是圆柱的中心轴。
                // 所以我们要限制其他旋转，只允许绕局部 Y 轴旋转？
                // 不，HingeJoint 允许绕指定轴自由旋转。
                
                // 在 Babylon Havok Plugin 中，addJoint 的配置如下：
                wheel.physicsImpostor.addJoint(deck.physicsImpostor, {
                    type: BABYLON.PhysicsJointType.HingeJoint, // 指定关节类型
                    mainPivot: new BABYLON.Vector3(0, 0, 0), // 轮子局部的枢轴点 (中心)
                    connectedPivot: new BABYLON.Vector3(pos.x, wheelY - deck.position.y, pos.z), // 相对于板身的枢轴点
                    mainAxis: new BABYLON.Vector3(0, 1, 0), // 轮子局部的旋转轴 (Cylinder 默认轴是 Y)
                    connectedAxis: new BABYLON.Vector3(0, 1, 0) // 板身对应的轴 (通常不需要严格对齐，只要位置对即可)
                });
            });

            // 6. 重置功能
            const resetSkateboard = () => {
                skateboardRoot.position = new BABYLON.Vector3(0, 10, -10); // 空中
                skateboardRoot.rotation = new BABYLON.Vector3(0, 0, 0);
                
                // 清除速度
                if (deck.physicsImpostor) {
                    deck.physicsImpostor.setLinearVelocity(new BABYLON.Vector3(0, 0, 0));
                    deck.physicsImpostor.setAngularVelocity(new BABYLON.Vector3(0, 0, 0));
                    // 重置位置需要直接设置 Mesh 位置，物理引擎会在下一帧同步
                    deck.position = new BABYLON.Vector3(0, 0.5, 0); // 相对父节点
                    deck.rotation = new BABYLON.Vector3(0,0,0);
                }
                wheels.forEach(w => {
                    if (w.physicsImpostor) {
                        w.physicsImpostor.setLinearVelocity(new BABYLON.Vector3(0, 0, 0));
                        w.physicsImpostor.setAngularVelocity(new BABYLON.Vector3(0, 0, 0));
                        // 重置轮子相对位置
                        w.position = new BABYLON.Vector3(w.position.x, 0, w.position.z); // 保持X,Z，重置Y相对
                        w.rotation = new BABYLON.Vector3(0, 0, Math.PI/2);
                    }
                });
                
                // 强制同步物理状态到当前视觉位置
                // 在 Havok 中，有时需要手动触发同步或等待一帧
            };

            resetSkateboard();
            resetBtn.addEventListener("click", resetSkateboard);

            return scene;
        };

        // 由于 init 是 async 的，我们需要这样处理
        let scene;
        createScene().then(function (createdScene) {
            scene = createdScene;
            engine.runRenderLoop(function () {
                scene.render();
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
