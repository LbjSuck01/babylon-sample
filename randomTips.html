
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>随机字符串展示器</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #ece9e6, #ffffff);
        }
        .card-shadow {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        button:hover i {
            transform: scale(1.1);
            transition: all 0.3s ease-in-out;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white rounded-xl card-shadow overflow-hidden text-center relative z-10 py-8 px-6 space-y-6 animate-fadeIn">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">随机语录查看器</h1>
    
    <!-- 显示区 -->
    <div id="quoteDisplay"
         class="py-6 px-4 my-4 mx-auto w-full min-h-[120px] flex items-center justify-center border-l-4 border-blue-500 bg-blue-50 rounded-lg shadow-inner text-lg italic text-gray-700 break-all">
        加载中...
    </div>

    <!-- 控制按钮组 -->
    <div class="flex justify-between mt-6 gap-x-4">
        <button onclick="showPrevious()"
                class="bg-indigo-500 hover:bg-indigo-600 text-white py-2 px-5 rounded-full focus:outline-none shadow-md transition duration-300 flex items-center">
            <i class="fas fa-arrow-left mr-2"></i> 上一条
        </button>
        
        <button onclick="randomShow()"
                class="bg-purple-500 hover:bg-purple-600 text-white py-2 px-5 rounded-full focus:outline-none shadow-md transition duration-300 flex items-center">
            随机切换 <i class="fas fa-random ml-2"></i>
        </button>
        
        <button onclick="showNext()"
                class="bg-green-500 hover:bg-green-600 text-white py-2 px-5 rounded-full focus:outline-none shadow-md transition duration-300 flex items-center">
            下一条 <i class="fas fa-arrow-right ml-2"></i>
        </button>
    </div>

    <footer class="mt-8 text-sm text-gray-500">&copy; 2026 随机语录工具</footer>
</div>

<script>
// 示例字符串数组
const quotes = [
    "你确定你能按时完成你的工作吗？",
    "你有孩子吗？",
    "你介意给我你的微信账号吗？",
    "你今晚想吃匹萨饼吗？",
    "请问你知道哪里有一位好医生吗？",
    "我们不应该早点预定机票吗？",
    "你是否曾经有遇过危险的情况?",
    "那，你和我明天一起攻读晚餐怎么样?",
    "为何我总是得付账?",
    "大约需要多长的时间才能抵达到机场呢?",
    "你多常去看一次牙医?",
    "你的朋友怎么了?",
    "你最喜欢的歌是什么?",
    "为什么不在网上购买呢? 或是 你为什么不要再网上购买呢?",
    "你想要喝点什么吗?",
    "据我所知，她不喜欢他.",
    "就你知道的，我真的很讨厌苦瓜.",
    "相比起苦瓜，就连西兰花都比较好吃。",
    "就我所知，他可能在火星上。",
    "我敢打赌今天会下雨。",
    "我迫不及待要拿到我的薪水.",
    "在我看来，现在是买房子的好时机.",
    "我刚刚才意识到，我从没有确定过我们的约会.",
    "我想要早点离开.	我想要你早点离开.",
    "我讨厌这么说，但是'蓝色'不是合适你的颜色.",
    "我不知道地铁在哪里。",
    "我必须在星期五之前找到一间新公寓.",
    "如果你仔细想想，金钱不是生活中所有的一切。",
    "我会让你知道一旦我今天有空的时候。",
    "我恐怕他现在太忙了。",
    "我很期待春节长假。",
    "我很对不起，但是我不能和你一起吃晚餐。",
    "我正在考虑为她订购一个生日蛋糕。",
    "我很遗憾她摔断了腿。",
    "不是因为他懒散，而是因为他不在乎。",
    "我都在一整天里，担心着她。",
    "我宁愿去参观夏威夷也不愿去洛杉矶。",
    "让我知道你是否明天有空。or 让我知道你明天何时有空。",
    "难怪你的英语这么好!",
    "无意冒犯，但是你的发音需要改进。",
    "一旦你开始吸烟，就很难停下来。",
    "说到爱情，你打算什么时候结婚？",
    "多亏了我的老板，我才能得到一份不错的年终奖金.",
    "谢谢你上周帮我搬家，我知道这带给你很多不便。",
    "你的钱越多，你的问题就越多。",
    "没有什么比学习中文更困难了。",
    "我最爱的莫过于坐在沙滩上看书了。",
    "说实话，我真的不是很喜欢看恐怖电影。",
    "我们最好在晚上10点之前离开，否则地铁将被关闭了。",
    "我们不妨坐出租车去把，没有人想在雨中骑自行车。",
];

let currentIndex = Math.floor(Math.random() * quotes.length); // 初始索引设为随机数

function updateQuote(index) {
    const displayElement = document.getElementById("quoteDisplay");
    if (!displayElement) return;

    displayElement.textContent = quotes[index];
}

function randomShow() {
    let newIndex;
    do {
        newIndex = Math.floor(Math.random() * quotes.length);
    } while(newIndex === currentIndex && quotes.length > 1);

    currentIndex = newIndex;
    updateQuote(currentIndex);
}

function showPrevious() {
    currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
    updateQuote(currentIndex);
}

function showNext() {
    currentIndex = (currentIndex + 1) % quotes.length;
    updateQuote(currentIndex);
}

// 页面加载完成后初始化显示
document.addEventListener('DOMContentLoaded', function() {
    updateQuote(currentIndex);
});
</script>
</body>
</html>
