<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skateboard Physics Demo - Fixed</title>
    <style>
        html, body { overflow: hidden; width: 100%; height: 100%; margin: 0; padding: 0; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; outline: none; }
        #ui-layer {
            position: absolute; top: 10px; left: 10px; color: white;
            font-family: sans-serif; background: rgba(0, 0, 0, 0.6);
            padding: 15px; border-radius: 8px; pointer-events: none; user-select: none;
        }
        kbd {
            background-color: #eee; border-radius: 3px; border: 1px solid #b4b4b4;
            box-shadow: 0 1px 1px rgba(0,0,0,.2); color: #333;
            display: inline-block; font-size: .85em; font-weight: 700;
            line-height: 1; padding: 2px 4px; white-space: nowrap;
        }
    </style>
    
    <!-- 1. Babylon.js 核心库 (最新稳定版) -->
<script src="https://cdn.babylonjs.com/babylon.js"></script>

<!-- 2. Cannon.js 物理引擎 (Babylon 官方提供的兼容版本) -->
<!-- 注意：Cannon.js 不是 Babylon 的一部分，但 Babylon 社区维护了一个常用的 CDN 镜像 -->
<script src="https://cdn.babylonjs.com/cannon.js"></script>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="ui-layer">
        <h3>🛹 滑板物理演示 (修复版)</h3>
        <p><kbd>W</kbd> / <kbd>↑</kbd> : 加速</p>
        <p><kbd>S</kbd> / <kbd>↓</kbd> : 刹车</p>
        <p><kbd>A</kbd> / <kbd>D</kbd> : 转向</p>
        <p><kbd>Space</kbd> : 跳跃</p>
    </div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // 全局输入状态
        const inputState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            jump: false
        };

        // 原生事件监听 (比 ActionManager 更稳定，避免 internal error)
        window.addEventListener("keydown", (e) => {
            switch(e.key.toLowerCase()) {
                case "w": case "arrowup": inputState.forward = true; break;
                case "s": case "arrowdown": inputState.backward = true; break;
                case "a": case "arrowleft": inputState.left = true; break;
                case "d": case "arrowright": inputState.right = true; break;
                case " ": inputState.jump = true; break;
            }
        });

        window.addEventListener("keyup", (e) => {
            switch(e.key.toLowerCase()) {
                case "w": case "arrowup": inputState.forward = false; break;
                case "s": case "arrowdown": inputState.backward = false; break;
                case "a": case "arrowleft": inputState.left = false; break;
                case "d": case "arrowright": inputState.right = false; break;
                case " ": inputState.jump = false; break;
            }
        });

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.8, 0.9, 1.0);

            // --- 1. 物理引擎初始化 (关键修复点) ---
            try {
                // 检查 CANNON 是否存在
                if (typeof CANNON === 'undefined') {
                    throw new Error("Cannon.js not loaded");
                }
                
                // 显式传入 CANNON 全局对象，防止插件内部查找失败
                const physicsPlugin = new BABYLON.CannonJSPlugin(true, null, CANNON);
                scene.enablePhysics(new BABYLON.Vector3(0, -9.81, 0), physicsPlugin);
                console.log("Physics initialized with CannonJS");
            } catch (e) {
                console.error("Physics Init Failed:", e);
                alert("物理引擎初始化失败: " + e.message);
                return scene;
            }

            // --- 2. 相机 ---
            const camera = new BABYLON.ArcRotateCamera("ArcCam", new BABYLON.Vector3(0, 10, 20), scene);
            camera.setTarget(new BABYLON.Vector3(0, 0, 0));
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 5;
            camera.upperRadiusLimit = 50;

            // --- 3. 灯光 ---
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.7;
            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(20, 40, 20);
            dirLight.intensity = 0.8;
            const shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;

            // --- 4. 地面 ---
            const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 100, height: 100 }, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            ground.material = groundMat;
            ground.receiveShadows = true;
            
            // 地面物理
            ground.physicsImpostor = new BABYLON.PhysicsImpostor(ground, BABYLON.PhysicsImpostor.BoxImpostor, { 
                mass: 0, restitution: 0.1, friction: 0.5 
            }, scene);

            // --- 5. 斜坡 ---
            const ramp = BABYLON.MeshBuilder.CreateBox("ramp", { width: 4, height: 1, depth: 6 }, scene);
            ramp.position = new BABYLON.Vector3(0, 0.5, 15);
            ramp.rotation.x = -Math.PI / 8; 
            const rampMat = new BABYLON.StandardMaterial("rampMat", scene);
            rampMat.diffuseColor = new BABYLON.Color3(0.8, 0.4, 0.2);
            ramp.material = rampMat;
            ramp.physicsImpostor = new BABYLON.PhysicsImpostor(ramp, BABYLON.PhysicsImpostor.BoxImpostor, { 
                mass: 0, restitution: 0.2, friction: 0.3 
            }, scene);
            shadowGenerator.getShadowMap().renderList.push(ramp);

            // --- 6. 滑板 ---
            const skateboardRoot = new BABYLON.TransformNode("skateboardRoot", scene);
            
            // 板面
            const deck = BABYLON.MeshBuilder.CreateBox("deck", { width: 2.2, height: 0.15, depth: 7 }, scene);
            const deckMat = new BABYLON.StandardMaterial("deckMat", scene);
            deckMat.diffuseColor = new BABYLON.Color3(0.1, 0.4, 0.8);
            deck.material = deckMat;
            deck.parent = skateboardRoot;
            shadowGenerator.getShadowMap().renderList.push(deck);

            // 板面物理
            deck.physicsImpostor = new BABYLON.PhysicsImpostor(deck, BABYLON.PhysicsImpostor.BoxImpostor, { 
                mass: 5, restitution: 0.2, friction: 0.5 
            }, scene);

            // 轮子
            const wheelRadius = 0.35;
            const wheelThickness = 0.2;
            const wheelOffsets = [
                new BABYLON.Vector3(-0.8, -0.2, 2.2),
                new BABYLON.Vector3(0.8, -0.2, 2.2),
                new BABYLON.Vector3(-0.8, -0.2, -2.2),
                new BABYLON.Vector3(0.8, -0.2, -2.2)
            ];

            const wheels = [];
            const wheelMat = new BABYLON.StandardMaterial("wheelMat", scene);
            wheelMat.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.9);

            wheelOffsets.forEach((offset, index) => {
                const wheel = BABYLON.MeshBuilder.CreateCylinder(`wheel_${index}`, { 
                    diameter: wheelRadius * 2, height: wheelThickness, tessellation: 16 
                }, scene);
                
                wheel.rotation.z = Math.PI / 2; 
                wheel.material = wheelMat;
                wheel.parent = skateboardRoot;
                
                // 设置初始位置
                const initialWorldPos = deck.position.clone().add(offset);
                wheel.position = initialWorldPos;

                // 轮子物理
                wheel.physicsImpostor = new BABYLON.PhysicsImpostor(wheel, BABYLON.PhysicsImpostor.CylinderImpostor, {
                    mass: 1, restitution: 0.1, friction: 1.0
                }, scene);

                // 关节
                const joint = new BABYLON.HingeJoint({
                    mainPivot: offset,
                    connectedPivot: new BABYLON.Vector3(0, 0, 0),
                    mainAxis: new BABYLON.Vector3(0, 0, 1),
                    connectedAxis: new BABYLON.Vector3(0, 0, 1)
                });

                deck.physicsImpostor.addJoint(wheel.physicsImpostor, joint);
                wheels.push(wheel);
            });

            // --- 7. 渲染循环 (使用原生输入状态) ---
            scene.registerBeforeRender(() => {
                // 安全检查：确保物理 impostor 存在
                if (!deck.physicsImpostor || !deck.physicsImpostor.object) return;

                const forceMultiplier = 15;
                const turnSpeed = 0.2;

                // 【修复点】：Mesh 没有 getForwardRay() 方法
                // 正确做法：使用 getDirection 获取局部 Z 轴正向在世界空间的方向
                // 注意：Babylon 中默认前方通常是 +Z 或 -Z，取决于模型朝向。
                // 如果滑板向后跑，尝试改为 new BABYLON.Vector3(0, 0, -1)
                const forward = deck.getDirection(new BABYLON.Vector3(0, 0, 1));
                
                // 确保力只作用在水平面上（忽略 Y 轴分量，防止滑板飞上天或钻地）
                forward.y = 0; 
                forward.normalize();

                // 加速
                if (inputState.forward) {
                    deck.physicsImpostor.applyImpulse(forward.scale(forceMultiplier), deck.getAbsolutePosition());
                }
                
                // 刹车
                if (inputState.backward) {
                    deck.physicsImpostor.applyImpulse(forward.scale(-forceMultiplier * 0.5), deck.getAbsolutePosition());
                }

                // 转向
                if (inputState.left) {
                    const currentAngVel = deck.physicsImpostor.getAngularVelocity();
                    // 围绕 Y 轴旋转
                    deck.physicsImpostor.setAngularVelocity(new BABYLON.Vector3(currentAngVel.x, turnSpeed, currentAngVel.z));
                }
                if (inputState.right) {
                    const currentAngVel = deck.physicsImpostor.getAngularVelocity();
                    deck.physicsImpostor.setAngularVelocity(new BABYLON.Vector3(currentAngVel.x, -turnSpeed, currentAngVel.z));
                }

                // 跳跃
                if (inputState.jump) {
                    deck.physicsImpostor.applyImpulse(new BABYLON.Vector3(0, 80, 0), deck.getAbsolutePosition());
                    inputState.jump = false; // 防止连续跳
                }
            });

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
