<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

        <title>施禹辰拿水枪</title>

        <!-- Babylon.js -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.6.2/dat.gui.min.js"></script>
        <script src="https://assets.babylonjs.com/generated/Assets.js"></script>
        <script src="https://cdn.babylonjs.com/recast.js"></script>
        <script src="https://cdn.babylonjs.com/ammo.js"></script>
        <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
        <script src="https://cdn.babylonjs.com/cannon.js"></script>
        <script src="https://cdn.babylonjs.com/Oimo.js"></script>
        <script src="https://cdn.babylonjs.com/earcut.min.js"></script>
        <script src="https://cdn.babylonjs.com/babylon.js"></script>
        <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
        <script src="https://cdn.babylonjs.com/proceduralTexturesLibrary/babylonjs.proceduralTextures.min.js"></script>
        <script src="https://cdn.babylonjs.com/postProcessesLibrary/babylonjs.postProcess.min.js"></script>
        <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
        <script src="https://cdn.babylonjs.com/serializers/babylonjs.serializers.min.js"></script>
        <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
        <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>

        <style>
            html, body {
                overflow: hidden;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }

            #renderCanvas {
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            
            #canvasZone {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
<body>
    <div id="canvasZone"><canvas id="renderCanvas"></canvas></div>
    <script>
        var canvas = document.getElementById("renderCanvas");

        var startRenderLoop = function (engine, canvas) {
            engine.runRenderLoop(function () {
                if (sceneToRender && sceneToRender.activeCamera) {
                    sceneToRender.render();
                }
            });
        }

        var engine = null;
        var scene = null;
        var sceneToRender = null;
        var createDefaultEngine = function() { return new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true,  disableWebGL2Support: false}); };
        const createScene =  () => {
            engine.displayLoadingUI();
            const scene = new BABYLON.Scene(engine);

            // Camera
	        var camera = new BABYLON.ArcRotateCamera("camera1", Math.PI / 2, Math.PI / 4, 6, new BABYLON.Vector3(0, 1, 0), scene);
	        camera.attachControl(canvas, true);

            // Lights
        	var light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
        	light.intensity = 0.6;
        	light.specular = BABYLON.Color3.Black();

			var light2 = new BABYLON.DirectionalLight("dir01", new BABYLON.Vector3(0, -0.5, -1.0), scene);
			light2.position = new BABYLON.Vector3(0, 5, 5);

			// Shadows
			var shadowGenerator = new BABYLON.ShadowGenerator(1024, light2);
			shadowGenerator.useBlurExponentialShadowMap = true;
			shadowGenerator.blurKernel = 32;

            BABYLON.SceneLoader.ImportMesh("", "./meshes/", "rodmanAnim.glb", scene, function (newMeshes, particleSystems, skeletons, animationGroups) {

				shadowGenerator.addShadowCaster(scene.meshes[0], true);
				for (var index = 0; index < newMeshes.length; index++) {
					newMeshes[index].receiveShadows = false;
				}

                var helper = scene.createDefaultEnvironment({
        			enableGroundShadow: true
        		});
        		helper.setMainColor(BABYLON.Color3.Gray());
        		helper.ground.position.y += 0.01;

				console.log('scene.meshes[0]', scene.meshes[0]);
				console.log('newMeshes', newMeshes);

				// Initialize override animations, turn on idle by default
				var idleAnim = scene.animationGroups.find(a => a.name === 'Idle');
				var idleParam = { name: "Idle", anim: idleAnim, weight: 1 };
		        idleAnim.weight = 1;
				idleAnim.play(true);

				var walkAnim = scene.animationGroups.find(a => a.name === 'Walking');
				var walkParam = { name: "Walk", anim: walkAnim, weight: 0 };
		        walkAnim.weight = 0;
				walkAnim.play(true);

				var runAnim = scene.animationGroups.find(a => a.name === 'Running');
				var runParam = { name: "Run", anim: runAnim, weight: 0 };
		        runAnim.weight = 0;
				runAnim.play(true);

				var punchAnim = scene.animationGroups.find(a => a.name === 'Punching');
				var punchParam = { name: "Punch", anim: punchAnim, weight: 0 };
		        punchAnim.weight = 0;
				punchAnim.play(true);

				var elbowAnim = scene.animationGroups.find(a => a.name === 'Elbow_punching');
				var runParam = { name: "Elbow", anim: elbowAnim, weight: 0 };
		        elbowAnim.weight = 0;
				elbowAnim.play(true);

                // const gunmove = scene.getAnimationGroupByName("gunmove");

                // scene.onBeforeRenderObservable.add(() => {
                //     if(gunmove){
                //     gunmove.start(true, 1.0, gunmove.from, gunmove.to, true);
                // } 
                // });


                engine.hideLoadingUI();

            });
    
            return scene;
        }
        window.initFunction = async function() {
            
            
            
            var asyncEngineCreation = async function() {
                try {
                return createDefaultEngine();
                } catch(e) {
                console.log("the available createEngine function failed. Creating the default engine instead");
                return createDefaultEngine();
                }
            }

            window.engine = await asyncEngineCreation();
            if (!engine) throw 'engine should not be null.';
            startRenderLoop(engine, canvas);
            window.scene = createScene();
        };
        initFunction().then(() => {
            sceneToRender = scene                    
        });

        // Resize
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
